services:
  db:
    image: mariadb:10.6
    environment:
      - MYSQL_DATABASE=harmonia
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - 3506:3306
    volumes:
      - db_data:/var/lib/mysql

  php:
    build:
      dockerfile: ./docker/Dockerfile
      target: php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /var/www/html
    command: symfony serve --listen-ip=0.0.0.0 --no-tls
    ports:
      - 8000:8000
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  node:
    image: node:20
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    tty: true

  phpmyadmin:
    image: phpmyadmin
    ports:
      - 9988:80
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
      - MYSQL_ROOT_PASSWORD=root
      - UPLOAD_LIMIT=512M
    depends_on:
      - db

volumes:
  db_data:
